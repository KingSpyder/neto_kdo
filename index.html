<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171426">
    <meta name="description" content="Remote KDO opener — une expérience photo interactive à découvrir du bout des doigts.">
    <title>Remote KDO opener</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="experience">
      <header class="intro">
        <h1 id="story-title">Remote KDO opener</h1>
      </header>

      <section class="story" aria-labelledby="story-title">
        <div class="scene-shell">
          <svg class="gift-library" aria-hidden="true">
            <symbol id="gift-artwork" viewBox="0 0 48 52">
              <path class="gift-bow" d="M22 15C9 17 8 3 17 4c4 0 6 6 7 11 1-5 3-11 7-11 9-1 8 13-5 11"/>
              <rect class="gift-lid" x="3" y="14" width="42" height="9" rx="3"/>
              <rect class="gift-box" x="6" y="21" width="36" height="28" rx="3"/>
              <path class="gift-ribbon" d="M24 14v34"/>
            </symbol>
          </svg>
          <div class="floating-gifts" id="floating-gifts" aria-hidden="true">
            <span class="gift gift-one">
              <svg class="gift-art" viewBox="0 0 48 52">
                <use href="#gift-artwork"/>
              </svg>
            </span>
            <span class="gift gift-two">
              <svg class="gift-art" viewBox="0 0 48 52">
                <use href="#gift-artwork"/>
              </svg>
            </span>
            <span class="gift gift-three">
              <svg class="gift-art" viewBox="0 0 48 52">
                <use href="#gift-artwork"/>
              </svg>
            </span>
            <span class="gift gift-four">
              <svg class="gift-art" viewBox="0 0 48 52">
                <use href="#gift-artwork"/>
              </svg>
            </span>
          </div>

          <div class="stage" id="stage" data-step="1" role="group" tabindex="0" aria-label="Photo 1 sur 4">
            <img class="photo photo-two is-current" id="photo-two" src="photos/2.jpg" alt="La peluche dragon parmi les autres cadeaux" draggable="false">
            <img class="photo" id="photo-three" src="photos/3.jpg" alt="Un gros plan sur la peluche dragon et les cadeaux" decoding="async" draggable="false">
            <img class="photo" id="photo-four" src="photos/4.jpg" alt="Le dernier cadeau, un coffret Warhammer" decoding="async" draggable="false">

            <svg class="first-scene" id="first-scene" viewBox="0 0 1500 2000" preserveAspectRatio="none" role="group" aria-label="Photo 1 : fais glisser la grande peluche jaune">
              <defs>
                <path id="plush-outline" d="M 494.5 -20.48
                  C 494.5 29.52 515.5 66.87 502.5 113.87
                  C 495.5 136.87 484 204.64 505 227.64
                  C 451 234.64 449.17 237.13 399.17 253.13
                  C 336.17 282.13 335.5 363.93 300.5 431.93
                  C 266.5 509.93 235 559 225 660
                  C 208 850 205 1018 207 1164
                  C 210 1292 232.5 1361.91 278.5 1427.91
                  C 304.5 1465.91 408.83 1506.39 471.83 1518.39
                  C 547.83 1528.39 558 1578 650 1578
                  C 775 1580 904 1562 969 1535
                  C 1003 1517 1074.17 1511.64 1088.17 1494.64
                  C 1134.17 1441.64 1185.83 1309.13 1233.83 1214.13
                  C 1253.83 1104.13 1251.33 985.45 1257.33 874.45
                  C 1253.33 798.45 1233 698 1250 650
                  C 1268 592 1208.83 405.46 1148.33 319.98
                  C 1107.33 259.98 1170.67 343.64 1210.67 312.64
                  C 1253.67 282.64 1287.5 286.45 1309.5 256.45
                  C 1321.5 239.45 1324.17 192.16 1301.17 190.16
                  C 1249.17 185.16 1222 205 1188 209
                  C 1151 213 1118 204 1081 190
                  C 1041 200 1004 207 968 205
                  C 923 205 892 193 853 190
                  C 809 190 778 198 743 195
                  C 685 196 726.83 190.52 675.83 198.52
                  C 652.83 182.52 619.33 219.93 600.33 192.93
                  C 577.33 156.93 600.67 25.2 594.67 -28.8 Z"/>
                <mask id="scene-hole" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="2000" style="mask-type:luminance">
                  <rect width="1500" height="2000" fill="white"/>
                  <use href="#plush-outline" fill="black"/>
                </mask>
                <clipPath id="plush-clip" clipPathUnits="userSpaceOnUse">
                  <use href="#plush-outline"/>
                </clipPath>
              </defs>

              <image class="scene-background" id="scene-background" href="photos/1.jpg" width="1500" height="2000" mask="url(#scene-hole)"/>
              <g class="plush-layer" id="plush-layer" transform="translate(0 0)" role="button" tabindex="0" aria-label="Faire glisser la grande peluche pour découvrir la photo suivante">
                <image class="plush-image" href="photos/1.jpg" width="1500" height="2000" clip-path="url(#plush-clip)"/>
                <use class="plush-hit-area" href="#plush-outline"/>
              </g>
            </svg>
          </div>
        </div>

        <p class="hint" id="hint" aria-live="polite" aria-atomic="true">Fais glisser la grande peluche pour découvrir la suite.</p>

        <nav class="controls" id="controls" aria-label="Navigation dans les photos" hidden>
          <button class="nav-button" id="previous" type="button" aria-label="Photo précédente">
            <span aria-hidden="true">←</span>
          </button>
          <ol class="progress" id="progress" aria-label="Progression">
            <li class="is-current" aria-label="Photo 1"></li>
            <li aria-label="Photo 2"></li>
            <li aria-label="Photo 3"></li>
            <li aria-label="Photo 4"></li>
          </ol>
          <button class="nav-button" id="next" type="button" aria-label="Photo suivante">
            <span aria-hidden="true">→</span>
          </button>
        </nav>
      </section>
    </main>
  </body>
</html>
